function getLevel(s){return LEVELS.find(l=>s>=l.min&&s<=l.max)||LEVELS[4]}
function getTotalLevel(s){return TOTAL_LEVELS.find(l=>s>=l.min&&s<=l.max)||TOTAL_LEVELS[4]}
function calcScore(answers,comp){
  return comp.questions.reduce((sum,q)=>{
    const raw=answers[q.num]||0;
    return sum+(q.reverse?6-raw:raw);
  },0);
}

// SVG Radar Chart (no external lib needed)
function RadarChart({data}){
  const size=260, cx=130, cy=130, r=95;
  const n=data.length;
  const angles=data.map((_,i)=>((i*2*Math.PI)/n)-Math.PI/2);
  const toXY=(angle,val,max=25)=>{
    const d=(val/max)*r;
    return {x:cx+d*Math.cos(angle), y:cy+d*Math.sin(angle)};
  };
  const gridLevels=[0.2,0.4,0.6,0.8,1];
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{maxWidth:'100%'}}>
      {/* Grid rings */}
      {gridLevels.map(lvl=>{
        const pts=angles.map(a=>{
          const d=lvl*r;
          return `${cx+d*Math.cos(a)},${cy+d*Math.sin(a)}`;
        }).join(' ');
        return <polygon key={lvl} points={pts} fill="none" stroke="#334155" strokeWidth="1"/>;
      })}
      {/* Axis lines */}
      {angles.map((a,i)=>(
        <line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(a)} y2={cy+r*Math.sin(a)} stroke="#334155" strokeWidth="1"/>
      ))}
      {/* Data polygon */}
      <polygon
        points={data.map((d,i)=>{const p=toXY(angles[i],d.score);return `${p.x},${p.y}`}).join(' ')}
        fill="#7C3AED" fillOpacity="0.35" stroke="#7C3AED" strokeWidth="2.5" strokeLinejoin="round"
      />
      {/* Data points */}
      {data.map((d,i)=>{const p=toXY(angles[i],d.score);return(
        <circle key={i} cx={p.x} cy={p.y} r="5" fill="#7C3AED" stroke="#1E293B" strokeWidth="2"/>
      )})}
      {/* Labels */}
      {data.map((d,i)=>{
        const labelR=r+22;
        const x=cx+labelR*Math.cos(angles[i]);
        const y=cy+labelR*Math.sin(angles[i]);
        const anchor=Math.cos(angles[i])>0.1?'start':Math.cos(angles[i])<-0.1?'end':'middle';
        return(
          <g key={i}>
            <text x={x} y={y} textAnchor={anchor} dominantBaseline="middle" fill="#94A3B8" fontSize="12" fontFamily="Segoe UI">
              {d.icon} {d.short}
            </text>
            <text x={x} y={y+14} textAnchor={anchor} dominantBaseline="middle" fill={d.color} fontSize="11" fontFamily="Segoe UI" fontWeight="700">
              {d.score}/25
            </text>
          </g>
        );
      })}
    </svg>
  );
}

      <div ref={topRef} style={{minHeight:"100vh",background:"#F8FAFC"}}>
        {/* Sticky header */}
        <div style={{background:"white",borderBottom:"1px solid #E2E8F0",position:"sticky",top:0,zIndex:10,padding:"10px 16px"}}>
          <div style={{maxWidth:680,margin:"0 auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
              <span style={{fontSize:12,color:"#64748B"}}>🧠 Growth Mindset</span>
              <span style={{fontSize:12,color:"#64748B"}}>{totalAnswered}/25 · {progress}%</span>
            </div>
            <div style={{background:"#E2E8F0",borderRadius:99,height:5,marginBottom:8}}>
              <div style={{height:"100%",borderRadius:99,background:"linear-gradient(90deg,#2563EB,#7C3AED)",width:`${progress}%`,transition:"width 0.3s"}}/>
            </div>
            <div style={{display:"flex",gap:5}}>
              {COMPETENCIES.map((c,i)=>(
                <button key={c.id} onClick={()=>setSec(i)}
                  style={{flex:1,padding:"5px 2px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                    background:i===sec?c.color:secDone(c)?c.color+"33":"#F1F5F9",
                    color:i===sec?"white":secDone(c)?c.color:"#94A3B8"}}>
                  {secDone(c)&&i!==sec?"✓":c.icon}
                </button>
              ))}
            </div>
          </div>
        </div>

        <div style={{maxWidth:680,margin:"0 auto",padding:"18px 14px 48px"}}>
          <div className="fade-up">
            {/* Section header */}
            <div style={{background:`linear-gradient(135deg,${comp.color},${comp.color}CC)`,borderRadius:14,padding:"18px 22px",marginBottom:16,color:"white"}}>
              <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:5}}>
                <span style={{fontSize:24}}>{comp.icon}</span>
                <div>
                  <div style={{fontSize:11,opacity:0.75,letterSpacing:2,textTransform:"uppercase"}}>Năng lực {comp.num}</div>
                  <div style={{fontSize:19,fontWeight:700}}>{comp.title}</div>
                </div>
              </div>
              <p style={{margin:0,opacity:0.85,fontSize:13}}>{comp.subtitle}</p>
            </div>

            {/* Scale legend */}
            <div style={{display:"flex",gap:4,marginBottom:14,background:"white",borderRadius:9,padding:"8px 10px",border:"1px solid #E2E8F0"}}>
              {[1,2,3,4,5].map(n=>(
                <div key={n} style={{flex:1,textAlign:"center",fontSize:11,color:"#64748B"}}>
                  <div style={{fontWeight:700,color:"#1E293B",fontSize:13}}>{n}</div>
                  <div style={{lineHeight:1.2}}>{SCALE_LABELS[n-1]}</div>
                </div>
              ))}
            </div>

            {/* Questions */}
            {comp.questions.map(q=>{
              const ans=answers[q.num];
              return(
                <div key={q.num} style={{background:"white",borderRadius:13,border:`2px solid ${ans?comp.color+"55":"#E2E8F0"}`,padding:"16px 18px",marginBottom:10,transition:"border-color 0.2s"}}>
                  <div style={{display:"flex",gap:10,marginBottom:12}}>
                    <span style={{width:26,height:26,borderRadius:"50%",background:ans?comp.color:"#F1F5F9",color:ans?"white":"#94A3B8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{q.num}</span>
                    <div>
                      <p style={{margin:0,color:"#1E293B",fontSize:14,lineHeight:1.6}}>{q.text}</p>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {[1,2,3,4,5].map(n=>(
                      <button key={n} onClick={()=>setAnswers(a=>({...a,[q.num]:n}))}
                        style={{flex:1,padding:"9px 4px",borderRadius:9,border:`2px solid ${ans===n?comp.color:"#E2E8F0"}`,background:ans===n?comp.color:"white",color:ans===n?"white":"#64748B",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                        {n}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}

            {/* Navigation */}
            <div style={{display:"flex",gap:10,marginTop:10}}>
              {sec>0&&(
                <button onClick={()=>setSec(s=>s-1)}
                  style={{flex:1,padding:13,borderRadius:11,border:"2px solid #E2E8F0",background:"white",color:"#64748B",fontSize:14,fontWeight:600,cursor:"pointer"}}>
                  ← Trước
                </button>
              )}
              {!isLast?(
                <button onClick={()=>{if(!done)return alert("Vui lòng trả lời đủ 5 câu trước khi tiếp tục");setSec(s=>s+1);}}
                  style={{flex:2,padding:13,borderRadius:11,border:"none",background:done?`linear-gradient(135deg,${comp.color},${comp.color}CC)`:"#E2E8F0",color:done?"white":"#94A3B8",fontSize:14,fontWeight:700,cursor:done?"pointer":"not-allowed"}}>
                  Năng lực tiếp theo →
                </button>
              ):(
                <button onClick={()=>{if(!allDone())return alert("Vui lòng hoàn thành tất cả câu hỏi");setStep("result");}}
                  style={{flex:2,padding:13,borderRadius:11,border:"none",background:allDone()?"linear-gradient(135deg,#059669,#0D9488)":"#E2E8F0",color:allDone()?"white":"#94A3B8",fontSize:14,fontWeight:700,cursor:allDone()?"pointer":"not-allowed"}}>
                  🎯 Xem kết quả
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── RESULT ─────────────────────────────────────────────
  const totalLvl=getTotalLevel(total);
  const sorted=[...scores].sort((a,b)=>a.score-b.score);
  const weakest=sorted[0];
  const strongest=sorted[sorted.length-1];
  const circ=2*Math.PI*60;
  const dash=(total/125)*circ;

  return(
    <div ref={topRef} style={{minHeight:"100vh",background:"#0F172A"}}>
      {/* Hero */}
      <div style={{background:"linear-gradient(135deg,#0F172A,#1E3A5F)",padding:"32px 20px 24px",textAlign:"center"}}>
        <div className="fade-up" style={{maxWidth:600,margin:"0 auto"}}>
          <div style={{fontSize:11,color:"#64748B",letterSpacing:3,textTransform:"uppercase",marginBottom:6}}>Kết Quả Đánh Giá</div>
          {saveStatus==="saving"&&<div style={{display:"inline-block",background:"#1E293B",border:"1px solid #334155",borderRadius:50,padding:"4px 14px",fontSize:12,color:"#94A3B8",marginBottom:8}}>⏳ Đang lưu kết quả...</div>}
          {saveStatus==="saved"&&<div style={{display:"inline-block",background:"#064E3B",border:"1px solid #059669",borderRadius:50,padding:"4px 14px",fontSize:12,color:"#34D399",marginBottom:8}}>✅ Đã lưu vào Google Sheets</div>}
          {saveStatus==="error"&&<div style={{display:"inline-block",background:"#450A0A",border:"1px solid #DC2626",borderRadius:50,padding:"4px 14px",fontSize:12,color:"#FCA5A5",marginBottom:8}}>⚠️ Lỗi kết nối Sheets</div>}
          <h2 style={{color:"#F1F5F9",fontSize:24,marginBottom:3}}>{info.name}</h2>
          {info.dept&&<p style={{color:"#64748B",fontSize:13,marginBottom:20}}>{info.title&&`${info.title} · `}{info.dept}</p>}

          {/* Score circle */}
          <div style={{display:"inline-block",marginBottom:10}}>
            <svg width="150" height="150" viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="60" fill="none" stroke="#1E293B" strokeWidth="12"/>
              <circle cx="75" cy="75" r="60" fill="none" stroke={totalLvl.color} strokeWidth="12"
                strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform="rotate(-90 75 75)"
                style={{transition:"stroke-dasharray 1.2s ease"}}/>
              <text x="75" y="68" textAnchor="middle" fill="#F1F5F9" fontSize="32" fontWeight="700" fontFamily="Segoe UI">{total}</text>
              <text x="75" y="86" textAnchor="middle" fill="#64748B" fontSize="12" fontFamily="Segoe UI">/125</text>
            </svg>
          </div>
          <div style={{color:totalLvl.color,fontSize:17,fontWeight:700,marginBottom:4}}>{totalLvl.label}</div>
          <div style={{color:"#94A3B8",fontSize:13}}>TB: <strong style={{color:"#F1F5F9"}}>{(total/5).toFixed(1)}</strong>/25 mỗi năng lực</div>
        </div>
      </div>

      <div style={{maxWidth:640,margin:"0 auto",padding:"18px 14px 48px"}}>
        <div className="fade-up">

          {/* Radar chart */}
          <div style={{background:"#1E293B",borderRadius:18,padding:"18px 12px",marginBottom:14,border:"1px solid #334155",display:"flex",flexDirection:"column",alignItems:"center"}}>
            <h3 style={{color:"#F1F5F9",marginBottom:12,fontSize:14,textAlign:"center"}}>Biểu đồ 5 Năng lực</h3>
            <RadarChart data={scores}/>
          </div>

          {/* Per-competency */}
          <h3 style={{color:"#94A3B8",fontSize:11,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Chi tiết từng năng lực</h3>
          {scores.map(comp=>{
            const lv=getLevel(comp.score);
            return(
              <div key={comp.id} style={{background:"#1E293B",borderRadius:13,border:`1px solid ${comp.color}33`,padding:"14px 16px",marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9}}>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:19}}>{comp.icon}</span>
                    <div>
                      <div style={{color:"#F1F5F9",fontWeight:700,fontSize:14}}>{comp.title}</div>
                      <div style={{color:lv.color,fontSize:11,fontWeight:600}}>{lv.label}</div>
                    </div>
                  </div>
                  <div>
                    <span style={{fontSize:24,fontWeight:700,color:comp.color}}>{comp.score}</span>
                    <span style={{color:"#64748B",fontSize:12}}>/25</span>
                  </div>
                </div>
                <div style={{background:"#0F172A",borderRadius:99,height:7,marginBottom:7}}>
                  <div className="fill-bar" style={{"--w":`${(comp.score/25)*100}%`,height:"100%",borderRadius:99,background:comp.color,width:`${(comp.score/25)*100}%`}}/>
                </div>
                <p style={{margin:0,color:"#94A3B8",fontSize:12,lineHeight:1.5}}>{lv.desc}</p>
              </div>
            );
          })}

          {/* Highlights */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            <div style={{background:strongest.color+"22",borderRadius:11,border:`1px solid ${strongest.color}44`,padding:"13px 14px"}}>
              <div style={{fontSize:10,color:strongest.color,letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>💪 Điểm mạnh nhất</div>
              <div style={{color:"#F1F5F9",fontWeight:700,fontSize:13}}>{strongest.icon} {strongest.title}</div>
              <div style={{color:strongest.color,fontSize:20,fontWeight:700}}>{strongest.score}/25</div>
            </div>
            <div style={{background:"#EA580C22",borderRadius:11,border:"1px solid #EA580C44",padding:"13px 14px"}}>
              <div style={{fontSize:10,color:"#EA580C",letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>🎯 Ưu tiên phát triển</div>
              <div style={{color:"#F1F5F9",fontWeight:700,fontSize:13}}>{weakest.icon} {weakest.title}</div>
              <div style={{color:"#EA580C",fontSize:20,fontWeight:700}}>{weakest.score}/25</div>
            </div>
          </div>

          {/* Note */}
          <div style={{background:"#1E293B",borderRadius:11,border:"1px solid #334155",padding:"13px 15px",marginBottom:14}}>
            <p style={{color:"#64748B",fontSize:12,margin:0,lineHeight:1.6}}>
              💡 <strong style={{color:"#94A3B8"}}>Lưu ý:</strong> Kết quả phản ánh nhận thức bản thân (self-perception). Đọc kèm đánh giá 360° từ quản lý và đồng nghiệp để có bức tranh đầy đủ. Tư duy phát triển là kỹ năng <em>có thể học được</em>.
            </p>
          </div>

          <button onClick={()=>{setAnswers({});setInfo({name:"",dept:"",title:""});setStep("intro");}}
            style={{width:"100%",padding:13,borderRadius:11,border:"2px solid #334155",background:"transparent",color:"#64748B",fontSize:14,cursor:"pointer",marginBottom:12}}>
            ↩ Làm lại từ đầu
          </button>
          <p style={{color:"#334155",fontSize:11,textAlign:"center"}}>Forval Vietnam · Korn Ferry Lominger · SHL OPQ · ICF</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
